# Server Configuration
server.port=8100
server.servlet.context-path=/

# 禁用MongoDB配置
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# MySQL配置 (本地直接安装的MySQL 9.3，非Docker容器)
spring.datasource.url=jdbc:mysql://localhost:3306/ict_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=xp198997
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 数据库持久化配置 - 确保使用文件数据库而不是内存数据库
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# 数据初始化 - 确保数据持久化
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# 允许循环依赖
spring.main.allow-circular-references=true

# JWT Configuration
jwt.secret=ictSystemSecretKey123456789012345678901234567890
jwt.expiration=86400000

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.ict.system=DEBUG

# 控制台输出编码配置
spring.output.ansi.enabled=always
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# 文件编码配置
file.encoding=UTF-8

# CORS Configuration
# 不使用通配符*，而是使用allowedOriginPatterns
spring.mvc.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# API Version Control
api.version.v1.enabled=false
api.version.v2.enabled=true